title: Vault Account Signing In From Many Planets
id: 3b3e8d85-4a9c-4c3e-9c8b-5e6f7a8b9ca3
status: test
description: One account signed in successfully from three planets within an hour.
author: Hermes Conrad
date: 2026-11-07
correlation:
    type: value_count
    rules:
        - vault_signin_success
    group-by:
        - target_user.email
    timespan: 1h
    condition:
        field: country
        gte: 3
level: high
