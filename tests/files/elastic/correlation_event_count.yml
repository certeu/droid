title: Vault Brute Force
id: 2a2d7c74-3f8b-4b2d-8b7a-4d5e6f7a8b92
status: test
description: Five failed sign-ins for one account within ten minutes.
author: Hermes Conrad
date: 2026-11-07
correlation:
    type: event_count
    rules:
        - vault_signin_failure
    group-by:
        - target_user.email
    timespan: 10m
    condition:
        gte: 5
level: medium
