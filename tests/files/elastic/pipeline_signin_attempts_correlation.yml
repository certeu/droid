name: Vault sign-in attempts correlations on Elastic
priority: 100

# Aggregations scan every event of their timespan: correlations read the
# sign-in data stream alone rather than the broader pattern the atomic rules use
transformations:

- id: index_set_state
  type: set_state
  key: "index"
  val: "logs-signin-attempts-planet-express-default"
  rule_conditions:
    - type: logsource
      product: vault
      service: signin_attempts
