name: Splunk third-party EDR process creation
priority: 100

# Purpose of this pipeline:
# Serve the windows/process_creation rules from third-party EDR telemetry instead of
# Sysmon, for the customers whose data lands in the third-party EDR indexes.

transformations:
  - id: edr_index_condition
    type: add_condition
    conditions:
      index: edr_events
    rule_conditions:
      - type: logsource
        category: process_creation
        product: windows
